<script>
  (function() {
    const torchBtn = document.getElementById('torch-toggle');
    const torchIcon = document.getElementById('torch-icon');
    let isTorchOn = false;

    if (torchBtn && torchIcon) {
      torchBtn.addEventListener('click', function() {
        isTorchOn = !isTorchOn;
        if (isTorchOn) {
          torchIcon.textContent = 'flash_on';
          torchBtn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
          torchBtn.classList.remove('bg-inverse-surface/85', 'text-inverse-on-surface');
        } else {
          torchIcon.textContent = 'flash_off';
          torchBtn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
          torchBtn.classList.add('bg-inverse-surface/85', 'text-inverse-on-surface');
        }
      });
    }

    const captureBtn = document.getElementById('btn-capture');
    if (captureBtn) {
      captureBtn.addEventListener('click', function() {
        captureBtn.classList.add('opacity-80', 'scale-[0.97]');
        setTimeout(function() {
          captureBtn.classList.remove('opacity-80', 'scale-[0.97]');
        }, 180);
      });
    }
  })();
